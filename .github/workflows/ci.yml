name: Private alpha validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check the core, procedural guards and report safety
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Reproduce the six fictional cases
        env:
          PYTHONPATH: src
        run: python -m piepowder demo --output artifacts/ci
      - name: Replay the synthetic docket
        env:
          PYTHONPATH: src
        run: python -m piepowder verify-docket artifacts/ci/docket.json
